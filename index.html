<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeoMeo - Discord</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
        }

        /* =========================
           VIDEO INTRO
        ========================= */
        #video-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #myVideo {
            display: block;
            width: 100%;
            max-height: 70vh;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            background: black;
        }

        /* Nút bấm chơi Video */
        #play-button {
            margin-top: 15px;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            background: #5865F2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
            transition: 0.2s;
        }

        #play-button:active {
            transform: scale(0.96);
        }

        /* Nút bỏ qua video */
        #skip-button {
            margin-top: 10px;
            background: transparent;
            border: none;
            color: #8b949e;
            font-size: 14px;
            text-decoration: underline;
            cursor: pointer;
        }

        /* =========================
           LỜI MỜI DISCORD
        ========================= */
        #invite-content {
            display: none;
            width: 100%;
            max-width: 650px;
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
        }

        #invite-content.show {
            display: block !important;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            margin-bottom: 12px;
            font-size: 28px;
        }

        p {
            margin-bottom: 25px;
            color: #8b949e;
            font-size: 16px;
        }

        .btn-join {
            display: inline-block;
            padding: 14px 32px;
            background-color: #5865F2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            transition: 0.2s;
        }

        .btn-join:hover {
            background-color: #4752C4;
            transform: scale(1.03);
        }
    </style>
</head>

<body>

    <!-- =========================
         VIDEO INTRO
    ========================= -->
    <div id="video-container">
        <video
            id="myVideo"
            playsinline
            preload="auto"
        >
            <source src="https://files.catbox.moe/t571eq.mp4" type="video/mp4">
            Trình duyệt của bạn không hỗ trợ video.
        </video>

        <!-- Nút bấm khởi chạy video -->
        <button id="play-button">
            ▶️ Bấm để Xem Video
        </button>

        <button id="skip-button">
            Bỏ qua Intro
        </button>
    </div>

    <!-- =========================
         LỜI MỜI DISCORD
    ========================= -->
    <div id="invite-content">
        <h2>🎉 Chào mừng bạn!</h2>
        <p>Bấm nút bên dưới để vào server Discord nhé.</p>
        <a class="btn-join" href="https://discord.gg/qEWUJMUXrM" target="_blank">
            Gia nhập ngay
        </a>
    </div>

    <script>
        const video = document.getElementById("myVideo");
        const videoContainer = document.getElementById("video-container");
        const inviteContent = document.getElementById("invite-content");
        const playButton = document.getElementById("play-button");
        const skipButton = document.getElementById("skip-button");

        // Hàm hiện khung Discord
        function showInvite() {
            videoContainer.style.display = "none";
            inviteContent.classList.add("show");
            setTimeout(function () {
                inviteContent.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });
            }, 100);
        }

        // Bấm nút để phát video có tiếng
        playButton.addEventListener("click", function () {
            video.muted = false;
            video.volume = 1;
            
            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.then(function() {
                    // Khi video bắt đầu chạy thì ẩn nút đi
                    playButton.style.display = "none";
                }).catch(function(error) {
                    console.log("Lỗi tải video:", error);
                    alert("Không tải được video, chuyển thẳng sang Discord!");
                    showInvite();
                });
            }
        });

        // Bấm nút bỏ qua
        skipButton.addEventListener("click", showInvite);

        // Phát hết video -> Chuyển màn hình
        video.addEventListener("ended", showInvite);

        // Lỗi video -> Chuyển màn hình
        video.addEventListener("error", function () {
            console.warn("Lỗi video. Hiện lời mời Discord.");
            showInvite();
        });
    </script>

</body>
</html>
