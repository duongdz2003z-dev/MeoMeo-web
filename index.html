<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tham gia Server Discord</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #0d1117;
            color: white;
        }
        video {
            width: 100%;
            max-width: 800px;
            height: auto;
        }
        .btn-sound {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 15px 0;
            background-color: #5865F2;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }
        a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #248046;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <video id="myVideo" autoplay muted playsinline controls>
        <source src="https://files.catbox.moe/v76lcl.mov" type="video/mp4">
        Trình duyệt của bạn không hỗ trợ thẻ video.
    </video>

    <div>
        <br>
        <button id="soundBtn" class="btn-sound" onclick="toggleSound()">🔊 Bật âm thanh</button>

        <h2>Tham gia Server Discord!</h2>
        <p>Xem xong intro rồi! Bấm nút bên dưới để vào server nhé.</p>
        
        <a href="https://discord.gg/qEWUJMUXrM">Gia nhập ngay</a>
    </div>

    <script>
        var video = document.getElementById("myVideo");
        var btn = document.getElementById("soundBtn");

        function toggleSound() {
            if (video.muted) {
                video.muted = false;
                btn.innerText = "🔇 Tắt âm thanh";
            } else {
                video.muted = true;
                btn.innerText = "🔊 Bật âm thanh";
            }
        }

        // Tự động bật tiếng ngay khi người dùng chạm vào bất kỳ đâu trên màn hình
        document.addEventListener('click', function() {
            if (video.muted) {
                video.muted = false;
                btn.innerText = "🔇 Tắt âm thanh";
            }
        }, { once: true });
    </script>

</body>
</html>
