<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tham gia Server Discord</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            overflow: hidden;
        }
        
        /* Khung Video chiếm nổi bật màn hình ban đầu */
        #video-container {
            width: 100%;
            max-width: 650px;
            display: block;
        }
        video {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        /* Ẩn hoàn toàn lời mời lúc đầu */
        #invite-content {
            display: none; 
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            margin-bottom: 12px;
            font-size: 28px;
        }
        p {
            margin-bottom: 25px;
            color: #8b949e;
            font-size: 16px;
        }
        .btn-join {
            display: inline-block;
            padding: 14px 32px;
            background-color: #5865F2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            transition: 0.2s;
        }
        .btn-join:hover {
            background-color: #4752C4;
        }
    </style>
</head>
<body>

    <!-- BƯỚC 1: CHỈ HIỆN VIDEO INTRO -->
    <div id="video-container">
        <video id="myVideo" autoplay muted playsinline>
            <source src="https://files.catbox.moe/v76lcl.mov" type="video/mp4">
            Trình duyệt của bạn không hỗ trợ thẻ video.
        </video>
    </div>

    <!-- BƯỚC 2: ẨN LỜI MỜI (CHỈ HIỆN KHI XEM XONG VIDEO) -->
    <div id="invite-content">
        <h2>🎉 Chào mừng bạn!</h2>
        <p>Xem xong intro rồi! Bấm nút bên dưới để vào server nhé.</p>
        <a class="btn-join" href="https://discord.gg/qEWUJMUXrM">Gia nhập ngay</a>
    </div>

    <script>
        var video = document.getElementById("myVideo");
        var videoContainer = document.getElementById("video-container");
        var inviteContent = document.getElementById("invite-content");

        // Tự động bật nhạc khi người dùng chạm vào màn hình trong lúc video đang chạy
        document.addEventListener('click', function() {
            if (video.muted) {
                video.muted = false;
            }
        }, { once: true });

        // Lắng nghe sự kiện: Video xem xong -> Ẩn video và Mới hiện lời mời
        video.addEventListener('ended', function() {
            videoContainer.style.display = 'none';  // Xóa video khỏi màn hình
            inviteContent.style.display = 'block';  // Mới cho lời mời hiện lên
        });
    </script>

</body>
</html>
